name: Build & Deploy Salwah Events to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-salwah-events
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static Astro site
        env:
          # STAGING FLAG:
          # Set to 'false' for live production indexing on https://www.salwahevents.com
          PUBLIC_STAGING_MODE: 'false'
          SITE_URL: 'https://www.salwahevents.com'
        run: npm run build && npm run verify

      - name: Deploy dist/ to deploy branch (Hostinger auto-deploy)
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: deploy
          folder: dist
          clean: true
          commit-message: 'Deploy compiled site from ${{ github.sha }}'
